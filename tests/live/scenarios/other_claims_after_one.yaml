id: other_claims_after_one
about: '"What about my other claims?" after the opening about one claim lists the caller''s other claims instead of asking which answer they want.'
group: resolving
turns:
  - say: "Hi, this is Margaret Chen. My date of birth is 1985-03-15 and the last four of my SSN are 4472."
    expect:
      verified: P9
  - say: "What's happening with my denied healthcare claim?"
    expect:
      focus: [CL-2048]
  - say: "What about my other claims?"
    expect:
      instructions_lack: [ask_which_answer, ask_need]
      reply_has: ["CL-2011", "CL-1899", "CL-2102"]
      check_passed: true
