id: pick_from_list_by_position
about: After a list of claims, "the newer one" and "the first one" pick the right claim.
group: resolving
turns:
  - say: "Hi, this is Margaret Chen. My date of birth is 1985-03-15 and the last four of my SSN are 4472."
    expect:
      verified: P9
  - say: "I have a question about my healthcare claim from January."
    expect:
      instructions: [which_claim]
  - say: "The newer one."
    expect:
      focus: [CL-2048]
  # One claim meant, two match: the list is shown. ("My claims from last year" means both, and both are then put in
  # focus with no list, as the claim-choosing rules say for two to five claims when several are meant.)
  - say: "Thanks. Now, what about my claim from last year?"
    expect:
      instructions: [which_claim]
  - say: "The first one."
    expect:
      focus_listed: 1
