id: thanks_after_the_email
about: After the summary is sent, "Thanks!" and "No, that's all" get a short goodbye; the email is not offered or sent again.
group: wrapup
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      verified: P9
  - say: "No, that's everything, thanks."
    expect:
      state: POST_PROCESS
      instructions: [offer_email]
  - say: "Yes, please send it."
    expect:
      state: DONE
      outbox_count: 1
  - say: "Thanks!"
    expect:
      state: DONE
      instructions: [goodbye]
      instructions_lack: [offer_email, offer_person]
      outbox_count: 1
  - say: "No, that's all."
    expect:
      state: DONE
      instructions_lack: [offer_email, offer_person]
      outbox_count: 1
