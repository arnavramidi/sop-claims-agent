id: send_to_another_address
about: '"Send it to my other address" is refused and a person is offered; nothing is sent.'
group: wrapup
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      verified: P9
  - say: "No, that's everything, thanks."
    expect:
      state: POST_PROCESS
      instructions: [offer_email]
  - say: "Yes, but send it to my other address, margaret.work@example.com."
    expect:
      outbox_count: 0
      instructions: [different_address_not_possible]
      reply_lacks: ["margaret\\.work", "example\\.com"]
      reply_has: ["person|someone|representative|colleague|team"]
