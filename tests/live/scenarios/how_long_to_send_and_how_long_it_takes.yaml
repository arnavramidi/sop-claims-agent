id: how_long_to_send_and_how_long_it_takes
about: '"How long do I have to send it" and "how long will it take" get different answers, and stray words like "photo" and "portal" do not change the question.'
group: processing
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      verified: P9
      focus: [CL-2048]
  - say: "How long do I have to send them?"
    expect:
      answers: [submission_timing]
      reply_has: ["within a week"]
  - say: "And once you have them, how long will it take?"
    expect:
      answers: [processing_time_after_submission]
      reply_has: ["less than a week"]
  - say: "I already put a photo of one page on the portal last week. How long until I hear back once everything is in?"
    expect:
      reply_has: ["less than a week"]
      reply_lacks: ["member portal", "upload link", "legible", "scan", "patient name"]
