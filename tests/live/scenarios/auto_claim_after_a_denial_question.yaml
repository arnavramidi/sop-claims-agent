id: auto_claim_after_a_denial_question
about: '"What about my auto claim?" after a denial question about the healthcare claim is answered for the auto claim, never as "it was not denied".'
group: memory
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      verified: P9
      focus: [CL-2048]
  - say: "What if I can't get the pathology report?"
    expect:
      focus: [CL-2048]
  - say: "What about my auto claim?"
    expect:
      focus: [CL-2102]
      memory: {focus.need_note: null}
      reply_has: ["CL-2102"]
      reply_lacks: ["not denied", "wasn't denied", "no denial"]
      check_passed: true
