id: meaning_of_a_figure_and_a_missing_report
about: '"What does allowed amount mean, and what if the clinic won''t reissue the report?" is split and both parts are answered.'
group: processing
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      verified: P9
      focus: [CL-2048]
  - say: "What does allowed amount mean, and what if the clinic won't reissue the report?"
    expect:
      reply_has: ["maximum", "replacement|resen[dt]|re-sen[dt]|readable scan|certified copy"]
      check_passed: true
