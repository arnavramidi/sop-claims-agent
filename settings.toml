[limits]
stalled_turns = 3
wrong_values = 3
consent_checks = 5
claims_in_focus = 5
claims_prepared = 3
unclear_email_replies = 2
model_retries = 1
model_timeout_seconds = 20
# The longest part of one caller message any model request carries; the stored message is always whole.
message_chars = 4000
# The most outstanding documents (of the claims in focus, in each claim's own order) offered to the form as choices.
documents_offered = 25
# What one turn's event records may hold: the longest body of one event (in characters of its JSON) and the most
# events one turn writes. Longer text is cut and further events are dropped, so a long message or a big form cannot
# grow the table without bound.
event_body_chars = 6000
events_per_turn = 40
# The most follow-up replies worded ahead in the background after one turn (when prepared replies are on), spread
# over at most claims_prepared claims in focus.
replies_prepared = 4
# An upset or angry caller is offered a person at this many turns that move nothing forward (gave no detail, got no
# answer), without waiting for stalled_turns.
upset_turns_before_offer = 2
# A message that asks several things has at most this many of them answered; the caller is asked to send the rest.
questions_per_message = 3
# The longest one filled form may be in a turn's record (each question as the fast model was asked it, with its
# answer), in characters of its JSON. Longer question texts are cut first.
form_asked_chars = 40000

[today]
date = 2026-03-05

[data]
folder = "data/starter"
reset_on_start = true

[models]
fast = "gpt-6-luna"
text = "gpt-6.1-sol"
larger = "gpt-6-astra"
# Output caps count reasoning tokens too (a cut-off reply is a failed call). 25000 is the docs' starting point; tune it down
# once real token use is known. Low reasoning effort and low verbosity keep thinking short and the reply brief.
wording_max_output_tokens = 25000
wording_reasoning_effort = "low"
wording_verbosity = "low"
extractor_max_output_tokens = 10000
extractor_reasoning_effort = "low"

[claims]
in_progress_statuses = ["open"]

[reply_check]
wary_status_words = ["approved", "pending", "rejected", "accepted", "processing", "under review"]
max_length = 1500

# Whole-word forms checked for each wary word (no stemming: "process" and "processing time" are fine).
[reply_check.status_forms]
approved = ["approved", "approve", "approves", "approval"]
pending = ["pending"]
rejected = ["rejected", "reject", "rejects", "rejection"]
accepted = ["accepted", "accept", "accepts", "acceptance"]
processing = ["processing", "processed"]
"under review" = ["under review"]

# Words whose polarity a reply may not flip: a reply may not negate one of them ("not required", "no deadline") unless
# a fact negates a word of the same group, and may not state one that the facts about a claim only negate ("paid"
# when the fact says "not paid yet"). Whole-word forms, like the status forms; the words of one group count as one
# ("no documents are needed" lets a reply say "nothing is required"). Claim statuses from the data and the wary
# status words above are guarded the same way without being listed here.
[reply_check.polarity_forms]
needed = ["need", "needs", "needed", "required", "require", "requires", "requirement", "requirements", "necessary",
          "requested", "missing", "outstanding", "have to", "has to"]
deadline = ["deadline", "deadlines", "due"]
passed = ["passed", "expired", "lapsed"]
paid = ["paid", "payment", "payments", "reimbursed"]
covered = ["covered", "coverage", "covers"]
received = ["received"]
eligible = ["eligible", "eligibility"]

[prepared_replies]
enabled = false

[braintrust]
project = "sop-claims-agent"

# Example caller phrasings a person approved: the file, plus the Braintrust dataset when a key is set (read once at
# start, waiting at most remote_timeout_seconds). Each is short ordinary text; at most per_option per option and
# total in all.
[examples]
path = "evals/approved_examples.json"
dataset = "approved-examples"
per_option = 5
total = 100
message_chars = 120
remote_timeout_seconds = 5

[freedom.strict]
claim_facts = false
settle_unsure = false
prepared_replies = false

[freedom.free]
claim_facts = true
settle_unsure = true
prepared_replies = true

[freedom.guided]
claim_facts = true
settle_unsure = false
prepared_replies = false

[states.VERIFY_ID]
freedom = "strict"
[states.AWAIT_CONSENT]
freedom = "strict"
[states.RESOLVE_INTENT]
freedom = "free"
[states.PROCESS_CASE]
freedom = "free"
[states.POST_PROCESS]
freedom = "guided"

[needs.denial_question]
opens_with = ["status", "denial_reason", "documents_needed", "appeal_deadline"]
[needs.document_submission]
opens_with = ["documents_needed", "appeal_deadline"]
[needs.next_steps]
opens_with = ["next_steps"]
[needs.status_inquiry]
opens_with = ["status"]
opens_with_when_denied = ["status", "denial_reason", "documents_needed"]
[needs.general_claim_question]
opens_with = ["status"]

[followups]
order = []
comes_after = {}

[followups.special.submission_timing]
with_deadline = true
drop_when_deadline_passed = true
[followups.special.file_format_requirements]
documents_as_requirements = true
[followups.special.missing_required_material_alternatives]
per_document_alternatives = true

# Hosted mode only (HOSTED=1): each visitor brings their own model key. The longest key accepted, and how many
# conversations and messages one visitor address may start or send per minute.
[hosted]
max_key_chars = 512
conversations_per_minute = 10
messages_per_minute = 30
tracked_addresses = 10000

# The server's database connections. A turn holds a connection and its conversation's lock through every model call
# (about two minutes at worst). A second message for a conversation whose turn is still running waits at most
# lock_wait_seconds, then is answered "busy"; a request waits at most pool_wait_seconds for a free connection; a
# transaction left paused longer than idle_in_transaction_seconds (longer than the longest wait between two of a
# turn's statements, a model call and its retry) is ended by the database, which frees its locks.
[database]
pool_size = 20
pool_wait_seconds = 10
lock_wait_seconds = 10
idle_in_transaction_seconds = 150
