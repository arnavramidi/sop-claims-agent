[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claims_agent"
version = "0.1.0"
requires-python = ">=3.12"
# Exact versions (the ones the image resolved when they were pinned), so a later build installs the same code.
# Everything the code imports directly is listed, even when another package would bring it in.
dependencies = [
  "fastapi==0.165.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary,pool]==3.3.9",
  "psycopg-binary==3.3.9",
  "psycopg-pool==3.3.3",
  "pydantic==2.14.4",
  "openai==3.57.0",
  "braintrust==0.52.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1", "pyyaml==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_agent = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
# The tracing library ships a pytest plugin that imports it at start-up; it is switched off so that a run with no
# key can show the library is never imported.
# Live tests call the real models and cost money: an ordinary run leaves them out, and `-m live` (a later -m wins)
# selects them.
addopts = "-p no:braintrust -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "unit: pure code, no database",
  "db: runs against real Postgres with scripted models",
  "planted: planted-fault checks",
  "live: needs a real model key",
]
